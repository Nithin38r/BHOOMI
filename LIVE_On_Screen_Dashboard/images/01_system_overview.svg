<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="2400" height="1380" font-family="Inter, DejaVu Sans, sans-serif"><rect width="1200" height="690" fill="#F7F5EF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6b63"/></marker></defs><text x="30" y="42" font-size="24" font-weight="800" fill="#173A26" text-anchor="start" >BHOOMI Live Dashboard Monitor: system overview</text><text x="30" y="66" font-size="13" font-weight="400" fill="#5f6b63" text-anchor="start" >Raspberry Pi 4 hub that collects data from every node and shows, sounds and sends it</text><rect x="30" y="76" width="60" height="4" rx="2" fill="#F2A33A"/><text x="40" y="118" font-size="12" font-weight="700" fill="#5f6b63" text-anchor="start" letter-spacing="2">FIELD NODES</text><rect x="40" y="132" width="210" height="74" rx="8" fill="#fff" stroke="#7A4E2D" stroke-width="1.6"/><rect x="40" y="132" width="8" height="74" rx="4" fill="#7A4E2D"/><text x="62" y="162" font-size="15" font-weight="700" fill="#173A26" text-anchor="start" >Soil Node(s)</text><text x="62" y="184" font-size="11.5" font-weight="400" fill="#5f6b63" text-anchor="start" >moisture, temp, humidity, light</text><rect x="40" y="232" width="210" height="74" rx="8" fill="#fff" stroke="#1A5F96" stroke-width="1.6"/><rect x="40" y="232" width="8" height="74" rx="4" fill="#1A5F96"/><text x="62" y="262" font-size="15" font-weight="700" fill="#173A26" text-anchor="start" >Pond Node(s)</text><text x="62" y="284" font-size="11.5" font-weight="400" fill="#5f6b63" text-anchor="start" >DO, pH, water temp, aerator</text><rect x="40" y="332" width="210" height="74" rx="8" fill="#fff" stroke="#C47F17" stroke-width="1.6"/><rect x="40" y="332" width="8" height="74" rx="4" fill="#C47F17"/><text x="62" y="362" font-size="15" font-weight="700" fill="#173A26" text-anchor="start" >Pump Node(s)</text><text x="62" y="384" font-size="11.5" font-weight="400" fill="#5f6b63" text-anchor="start" >motor starter, current, voltage</text><text x="40" y="446" font-size="11" font-weight="400" fill="#5f6b63" text-anchor="start" >865 MHz LoRa (433 MHz radio</text><text x="40" y="461" font-size="11" font-weight="400" fill="#5f6b63" text-anchor="start" >kept for the current soil node)</text><rect x="330" y="212" width="170" height="110" rx="8" fill="#E8F2EA" stroke="#1F5F3A" stroke-width="1.6"/><text x="415" y="250" font-size="15" font-weight="700" fill="#173A26" text-anchor="middle" >ESP32 Gateway</text><text x="415" y="272" font-size="11.5" font-weight="400" fill="#5f6b63" text-anchor="middle" >RFM95W 865 MHz</text><text x="415" y="289" font-size="11.5" font-weight="400" fill="#5f6b63" text-anchor="middle" >Ra-02 433 MHz</text><text x="415" y="306" font-size="11.5" font-weight="400" fill="#5f6b63" text-anchor="middle" >ACK + packet relay</text><path d="M250 169 L290 169 L290 267 L328 267" fill="none" stroke="#5f6b63" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M250 269 L290 269 L290 267 L328 267" fill="none" stroke="#5f6b63" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M250 369 L290 369 L290 267 L328 267" fill="none" stroke="#5f6b63" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M500 267 L568 267" fill="none" stroke="#5f6b63" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="534" y="258" font-size="11" font-weight="600" fill="#5f6b63" text-anchor="middle" >USB serial</text><rect x="570" y="120" width="300" height="300" rx="14" fill="#fff" stroke="#1F5F3A" stroke-width="2.2"/><rect x="570" y="120" width="300" height="40" rx="14" fill="#1F5F3A"/><rect x="570" y="146" width="300" height="14" fill="#1F5F3A"/><text x="720" y="146" font-size="15" font-weight="700" fill="#fff" text-anchor="middle" >Raspberry Pi 4 (hub brain)</text><circle cx="592" cy="185" r="4" fill="#1F5F3A"/><text x="604" y="189" font-size="12.5" font-weight="400" fill="#173A26" text-anchor="start" >Hub backend: AM1 parse, store, rules</text><circle cx="592" cy="217" r="4" fill="#1F5F3A"/><text x="604" y="221" font-size="12.5" font-weight="400" fill="#173A26" text-anchor="start" >SQLite + JSONL log on SD/USB</text><circle cx="592" cy="249" r="4" fill="#1F5F3A"/><text x="604" y="253" font-size="12.5" font-weight="400" fill="#173A26" text-anchor="start" >Alarm service (GPIO): LEDs, buzzer, siren</text><circle cx="592" cy="281" r="4" fill="#1F5F3A"/><text x="604" y="285" font-size="12.5" font-weight="400" fill="#173A26" text-anchor="start" >Voice alerts in the farmer's language</text><circle cx="592" cy="313" r="4" fill="#1F5F3A"/><text x="604" y="317" font-size="12.5" font-weight="400" fill="#173A26" text-anchor="start" >Wi-Fi hotspot  BHOOMI-HUB</text><circle cx="592" cy="345" r="4" fill="#1F5F3A"/><text x="604" y="349" font-size="12.5" font-weight="400" fill="#173A26" text-anchor="start" >Cloud sync + SMS service (4G modem)</text><circle cx="592" cy="377" r="4" fill="#1F5F3A"/><text x="604" y="381" font-size="12.5" font-weight="400" fill="#173A26" text-anchor="start" >Dashboard + kiosk on the HDMI screen</text><rect x="940" y="134" width="230" height="56" rx="8" fill="#fff" stroke="#1F5F3A" stroke-width="1.6"/><text x="956" y="156" font-size="13.5" font-weight="700" fill="#173A26" text-anchor="start" >10.1-inch HDMI touch screen</text><text x="956" y="175" font-size="11.5" font-weight="400" fill="#5f6b63" text-anchor="start" >1280×800 live dashboard, kiosk</text><path d="M870 160 L938 160" fill="none" stroke="#5f6b63" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="940" y="204" width="230" height="56" rx="8" fill="#fff" stroke="#1F5F3A" stroke-width="1.6"/><text x="956" y="226" font-size="13.5" font-weight="700" fill="#173A26" text-anchor="start" >Mini OLED 0.96 inch (I2C)</text><text x="956" y="245" font-size="11.5" font-weight="400" fill="#5f6b63" text-anchor="start" >hub status, works without HDMI</text><path d="M870 230 L938 230" fill="none" stroke="#5f6b63" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="940" y="274" width="230" height="56" rx="8" fill="#fff" stroke="#C0392B" stroke-width="1.6"/><text x="956" y="296" font-size="13.5" font-weight="700" fill="#173A26" text-anchor="start" >Buzzer + siren + speaker</text><text x="956" y="315" font-size="11.5" font-weight="400" fill="#5f6b63" text-anchor="start" >local alarm and voice</text><path d="M870 300 L938 300" fill="none" stroke="#5f6b63" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="940" y="344" width="230" height="56" rx="8" fill="#fff" stroke="#C47F17" stroke-width="1.6"/><text x="956" y="366" font-size="13.5" font-weight="700" fill="#173A26" text-anchor="start" >Status LEDs + buttons</text><text x="956" y="385" font-size="11.5" font-weight="400" fill="#5f6b63" text-anchor="start" >green / yellow / red, mute, shutdown</text><path d="M870 370 L938 370" fill="none" stroke="#5f6b63" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="570" y="470" width="300" height="64" rx="8" fill="#EAF3FA" stroke="#1A5F96" stroke-width="1.6"/><text x="720" y="498" font-size="13.5" font-weight="700" fill="#173A26" text-anchor="middle" >4G LTE modem (SIM7600 / A7670)</text><text x="720" y="518" font-size="11.5" font-weight="400" fill="#5f6b63" text-anchor="middle" >internet + SMS: ask anytime, daily report</text><path d="M720 420 L720 468" fill="none" stroke="#5f6b63" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="940" y="470" width="230" height="64" rx="8" fill="#fff" stroke="#1A5F96" stroke-width="1.6"/><text x="1055" y="498" font-size="13.5" font-weight="700" fill="#173A26" text-anchor="middle" >Cloud app + farmer SMS</text><text x="1055" y="518" font-size="11.5" font-weight="400" fill="#5f6b63" text-anchor="middle" >app anywhere, SMS on any phone</text><path d="M870 502 L938 502" fill="none" stroke="#5f6b63" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="330" y="470" width="200" height="64" rx="8" fill="#fff" stroke="#1F5F3A" stroke-width="1.6"/><text x="430" y="498" font-size="13.5" font-weight="700" fill="#173A26" text-anchor="middle" >Phones on hub Wi-Fi</text><text x="430" y="518" font-size="11.5" font-weight="400" fill="#5f6b63" text-anchor="middle" >http://bhoomi.local</text><path d="M600 420 L600 446 L430 446 L430 468" fill="none" stroke="#5f6b63" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="515" y="440" font-size="11" font-weight="600" fill="#5f6b63" text-anchor="middle" >Wi-Fi</text><rect x="40" y="560" width="1130" height="100" rx="8" fill="#FFF8E8" stroke="#F2A33A" stroke-width="1.6"/><text x="60" y="590" font-size="14" font-weight="800" fill="#173A26" text-anchor="start" >Safety rule</text><text x="60" y="614" font-size="12.5" font-weight="400" fill="#173A26" text-anchor="start" >The hub monitors, decides and alerts, but every node stays safe by itself. The Pond Node runs its aerator with no hub,</text><text x="60" y="634" font-size="12.5" font-weight="400" fill="#173A26" text-anchor="start" >and the Pump Node enforces its own run-time and dry-run limits. If the Pi stops, the field keeps working.</text></svg>