<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="2800" height="1960" font-family="Inter, DejaVu Sans, sans-serif"><rect width="1400" height="980" fill="#F7F5EF"/><text x="30" y="42" font-size="24" font-weight="800" fill="#173A26" text-anchor="start" >SMS from the hub: ask any time + daily morning report</text><text x="30" y="66" font-size="13" font-weight="400" fill="#5f6b63" text-anchor="start" >Works on any basic phone. Only registered numbers get replies. SMS is read-only: no pump or aerator control by SMS.</text><rect x="30" y="76" width="60" height="4" rx="2" fill="#F2A33A"/><rect x="40" y="110" width="380" height="600" rx="34" fill="#111"/><rect x="54" y="150" width="352" height="530" rx="8" fill="#ECE5DD"/><text x="230" y="138" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >Farmer's phone · BHOOMI hub</text><rect x="360.14" y="170" width="39.86" height="31.5" rx="10" fill="#DCF8C6" stroke="#d0d0d0"/><text x="372.14" y="190.0" font-size="13" font-weight="500" fill="#111" text-anchor="start" >Hi</text><rect x="60" y="213.5" width="293.376" height="151.0" rx="10" fill="#fff" stroke="#d0d0d0"/><text x="72" y="233.5" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">BHOOMI 07:00 24-Nov</text><text x="72" y="247.0" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">PN-01 Pond: DO 8.0 pH 7.8 29C Aerator OFF/AUTO</text><text x="72" y="260.5" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  Good</text><text x="72" y="274.0" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">SN-01 Groundnut: 37% Good</text><text x="72" y="287.5" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">SN-02 Chilli: 42% Good</text><text x="72" y="301.0" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">SN-03 Paddy: 61% Good</text><text x="72" y="314.5" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">SN-04 Cotton: 40% Good</text><text x="72" y="328.0" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">All normal - no alerts</text><text x="72" y="341.5" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">&gt; Plan irrigation for Field A within 19.6 h</text><text x="72" y="355.0" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">&gt; Plan irrigation for Field B within 18.7 h</text><rect x="344.28" y="376.5" width="55.72" height="31.5" rx="10" fill="#DCF8C6" stroke="#d0d0d0"/><text x="356.28" y="396.5" font-size="13" font-weight="500" fill="#111" text-anchor="start" >pond</text><rect x="60" y="420.0" width="293.376" height="56.5" rx="10" fill="#fff" stroke="#d0d0d0"/><text x="72" y="440.0" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">BHOOMI 07:00 24-Nov</text><text x="72" y="453.5" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">PN-01 Pond: DO 8.0 pH 7.8 29C Aerator OFF/AUTO</text><text x="72" y="467.0" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  Good</text><text x="230" y="740" font-size="13" font-weight="800" fill="#173A26" text-anchor="middle" >1 · Ask any time: text HI, SOIL, POND or ALERTS</text><rect x="460" y="110" width="380" height="600" rx="34" fill="#111"/><rect x="474" y="150" width="352" height="530" rx="8" fill="#ECE5DD"/><text x="650" y="138" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" >Every morning + emergencies</text><text x="650" y="176" font-size="10.5" font-weight="700" fill="#5f6b63" text-anchor="middle" >07:00 · daily report (automatic)</text><rect x="480" y="186" width="293.376" height="83.5" rx="10" fill="#fff" stroke="#d0d0d0"/><text x="492" y="206.0" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">BHOOMI 07:00 24-Nov</text><text x="492" y="219.5" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">PN-01 Pond: DO 8.0 pH 7.8 29C Aerator OFF/AUTO</text><text x="492" y="233.0" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  Good</text><text x="492" y="246.5" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">SN-01 Groundnut: 37% Good</text><text x="492" y="260.0" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  (full report as on the left)</text><text x="650" y="287.5" font-size="10.5" font-weight="700" fill="#B91C1C" text-anchor="middle" >02:14 · critical alert (automatic)</text><rect x="480" y="297.5" width="287.52" height="83.5" rx="10" fill="#fff" stroke="#d0d0d0"/><text x="492" y="317.5" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">BHOOMI ALERT 02:14 24-Nov</text><text x="492" y="331.0" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">!! PN-01: aerator ON but no current - check</text><text x="492" y="344.5" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  pump/power</text><text x="492" y="358.0" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">!! PN-01: aerator ON but oxygen still falling</text><text x="492" y="371.5" font-size="9.6" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">!! PN-01: oxygen critically low - 0.63 mg/L</text><text x="650" y="399.0" font-size="10.5" font-weight="700" fill="#5f6b63" text-anchor="middle" >Same SMS in Tamil (language: ta)</text><rect x="480" y="409.0" width="216.15" height="80" rx="10" fill="#fff" stroke="#d0d0d0"/><text x="492" y="429.0" font-size="10.5" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">BHOOMI 02:14 24-Nov</text><text x="492" y="445.0" font-size="10.5" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">PN-01 குளம்: DO 0.6 pH 7.4 27C</text><text x="492" y="461.0" font-size="10.5" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  காற்றூட்டி இயக்கம்/தானியங்கி</text><text x="492" y="477.0" font-size="10.5" font-weight="500" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  ஆபத்து</text><text x="650" y="740" font-size="13" font-weight="800" fill="#173A26" text-anchor="middle" >2 · Daily report + critical alerts by SMS</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6b63"/></marker></defs><rect x="890" y="130" width="470" height="72" rx="8" fill="#fff" stroke="#1F5F3A" stroke-width="1.6"/><text x="910" y="162" font-size="15" font-weight="800" fill="#173A26" text-anchor="start" >Farmer's phone</text><text x="910" y="184" font-size="12" font-weight="400" fill="#5f6b63" text-anchor="start" >any basic mobile, no app, no internet</text><path d="M1090 204 V238" stroke="#5f6b63" stroke-width="2" marker-end="url(#ah)"/><path d="M1160 238 V206" stroke="#5f6b63" stroke-width="2" marker-end="url(#ah)"/><rect x="890" y="242" width="470" height="72" rx="8" fill="#fff" stroke="#1F5F3A" stroke-width="1.6"/><text x="910" y="274" font-size="15" font-weight="800" fill="#173A26" text-anchor="start" >Mobile network</text><text x="910" y="296" font-size="12" font-weight="400" fill="#5f6b63" text-anchor="start" >4G / 3G / 2G SMS</text><path d="M1090 316 V350" stroke="#5f6b63" stroke-width="2" marker-end="url(#ah)"/><path d="M1160 350 V318" stroke="#5f6b63" stroke-width="2" marker-end="url(#ah)"/><rect x="890" y="354" width="470" height="72" rx="8" fill="#EAF3FA" stroke="#1A5F96" stroke-width="1.6"/><text x="910" y="386" font-size="15" font-weight="800" fill="#173A26" text-anchor="start" >4G LTE modem + SIM</text><text x="910" y="408" font-size="12" font-weight="400" fill="#5f6b63" text-anchor="start" >SIM7600 / A7670 on Pi USB</text><path d="M1090 428 V462" stroke="#5f6b63" stroke-width="2" marker-end="url(#ah)"/><path d="M1160 462 V430" stroke="#5f6b63" stroke-width="2" marker-end="url(#ah)"/><rect x="890" y="466" width="470" height="72" rx="8" fill="#E8F2EA" stroke="#1F5F3A" stroke-width="1.6"/><text x="910" y="498" font-size="15" font-weight="800" fill="#173A26" text-anchor="start" >sms_service.py</text><text x="910" y="520" font-size="12" font-weight="400" fill="#5f6b63" text-anchor="start" >reads SMS, checks number, builds reply</text><path d="M1090 540 V574" stroke="#5f6b63" stroke-width="2" marker-end="url(#ah)"/><path d="M1160 574 V542" stroke="#5f6b63" stroke-width="2" marker-end="url(#ah)"/><rect x="890" y="578" width="470" height="72" rx="8" fill="#E8F2EA" stroke="#1F5F3A" stroke-width="1.6"/><text x="910" y="610" font-size="15" font-weight="800" fill="#173A26" text-anchor="start" >Hub  /api/state</text><text x="910" y="632" font-size="12" font-weight="400" fill="#5f6b63" text-anchor="start" >same live data as the dashboard</text><text x="1080" y="676" font-size="11" font-weight="600" fill="#5f6b63" text-anchor="start" >↓ request</text><text x="1170" y="676" font-size="11" font-weight="600" fill="#5f6b63" text-anchor="start" >↑ reply</text><rect x="890" y="700" width="470" height="170" rx="8" fill="#FFF8E8" stroke="#F2A33A" stroke-width="1.6"/><text x="910" y="728" font-size="13.5" font-weight="800" fill="#173A26" text-anchor="start" >Settings (config/hub.json → sms)</text><text x="910" y="754" font-size="12" font-weight="400" fill="#173A26" text-anchor="start" >• registered_numbers: who may ask (others are ignored)</text><text x="910" y="776" font-size="12" font-weight="400" fill="#173A26" text-anchor="start" >• daily_report_numbers + daily_report_time (07:00)</text><text x="910" y="798" font-size="12" font-weight="400" fill="#173A26" text-anchor="start" >• language: en (160 chars/SMS) or te/hi/ta/kn (70 chars/SMS)</text><text x="910" y="820" font-size="12" font-weight="400" fill="#173A26" text-anchor="start" >• alert_sms_levels: [crit]  ·  max_sms_per_day: 60</text><text x="910" y="842" font-size="12" font-weight="400" fill="#173A26" text-anchor="start" >• Farmer can text REPORT OFF / REPORT ON to stop or restart</text><text x="40" y="950" font-size="11" font-weight="500" fill="#5f6b63" text-anchor="start" >Message text above is real output of sms_service.py --dry-run on demo data.</text></svg>