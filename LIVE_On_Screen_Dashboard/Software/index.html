<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHOOMI Smart Farm Monitor</title>
<meta name="theme-color" content="#0b1310">
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#0b1310; --bg2:#0f1a16; --card:#13201b; --card2:#172720; --line:#24382f; --line2:#2f4a3e;
  --tx:#e8f1ec; --mut:#8ea79a; --dim:#5f776b;
  --ok:#43c07f; --watch:#e3c34b; --warn:#f0903a; --crit:#ef5350; --info:#56a8e8; --cold:#5fb7d4;
  --brand:#a4e05a; --gold:#e8b04a; --water:#3d9be0;
  --r:1rem;
  --font:"Noto Sans","Noto Sans Telugu","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Kannada",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{font-size:calc(100vw / 120)}
@media (max-width:1100px){html{font-size:14px}}
body{margin:0;background:radial-gradient(1200px 600px at 15% -10%,#163126 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#13283a 0,transparent 55%),var(--bg);
  color:var(--tx);font-family:var(--font);overflow:hidden;height:100vh;-webkit-font-smoothing:antialiased}
@media (max-width:1100px){body{overflow:auto;height:auto}}
button{font-family:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;gap:.75rem;padding:.75rem 1rem}
@media (max-width:1100px){.app{height:auto}}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:1.2rem}
.brand{display:flex;align-items:center;gap:.8rem;min-width:0}
.logo{width:3.1rem;height:3.1rem;flex:none}
.bname{font-weight:700;font-size:1.75rem;letter-spacing:.14em;line-height:1}
.bname span{color:var(--brand)}
.bsub{color:var(--mut);font-size:.95rem;margin-top:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{margin-left:auto;text-align:right}
.clock .t{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.clock .d{color:var(--mut);font-size:.9rem;margin-top:.2rem}
.pill{display:inline-flex;align-items:center;gap:.45rem;padding:.35rem .8rem;border-radius:2rem;font-weight:700;font-size:.85rem;letter-spacing:.08em;border:1px solid var(--line2);background:var(--card)}
.pill .dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--dim)}
.pill.live .dot{background:var(--ok);box-shadow:0 0 0 0 rgba(67,192,127,.6);animation:pulse 2s infinite}
.pill.demo{border-color:#6b5a26;color:var(--gold)} .pill.demo .dot{background:var(--gold)}
.pill.off{border-color:#6b2a2a;color:var(--crit)} .pill.off .dot{background:var(--crit)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(67,192,127,.55)}70%{box-shadow:0 0 0 .6rem rgba(67,192,127,0)}100%{box-shadow:0 0 0 0 rgba(67,192,127,0)}}
.langs{display:flex;gap:.3rem;background:var(--card);border:1px solid var(--line);border-radius:2rem;padding:.25rem}
.langs button{background:none;border:0;color:var(--mut);font-size:.95rem;padding:.3rem .65rem;border-radius:1.5rem;font-weight:600}
.langs button.on{background:var(--brand);color:#10200f}
.langs button.rot{font-size:1rem}
.langs button.rot.on{background:var(--gold)}
.score{display:flex;align-items:center;gap:.6rem}
.score svg{width:3.4rem;height:3.4rem}
.score .lbl{font-size:.8rem;color:var(--mut);max-width:6rem;line-height:1.15}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.42fr) minmax(0,1.05fr);gap:.75rem;min-height:0}
@media (max-width:1100px){main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:.75rem;min-height:0;min-width:0}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:.8rem .95rem;min-height:0;position:relative}
.card h2{margin:0;font-size:1.08rem;font-weight:700;display:flex;align-items:center;gap:.55rem}
.card h2 .ic{width:1.35rem;height:1.35rem;flex:none}
.card h2 .sub{margin-left:auto;white-space:nowrap;font-weight:400;font-size:.82rem;color:var(--mut);display:flex;gap:.7rem;align-items:center}
.grow{flex:1}
.mut{color:var(--mut)} .mono{font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.78rem;padding:.12rem .5rem;border-radius:1rem;background:var(--bg2);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:#24553c}.chip.watch{color:var(--watch);border-color:#5d5222}
.chip.warn{color:var(--warn);border-color:#5e3d1e}.chip.crit{color:var(--crit);border-color:#5e2424}
.chip.info{color:var(--info);border-color:#21445e}.chip.cold{color:var(--cold);border-color:#21485a}

/* ---------- gauges ---------- */
.gauges{display:grid;gap:.5rem;margin-top:.6rem}
.g2{grid-template-columns:repeat(2,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:700px){.g4{grid-template-columns:repeat(2,1fr)}}
.gauge{background:var(--bg2);border:1px solid var(--line);border-radius:.8rem;padding:.45rem .4rem .5rem;text-align:center;position:relative;transition:border-color .4s}
.gauge.st-crit{border-color:#7a2a2a;box-shadow:inset 0 0 1.2rem rgba(239,83,80,.18)}
.gauge.st-warn{border-color:#6e4520}
.gauge .gt{font-size:.82rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.gauge svg{width:100%;height:auto;display:block}
.gauge .needle{transition:transform 1.1s cubic-bezier(.2,.9,.25,1.15);transform-box:view-box;transform-origin:100px 96px}
.gauge .valarc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.9,.25,1.05),stroke .4s}
.gauge .gs{margin-top:-.1rem}
.gauge.na svg{opacity:.35}

/* ---------- pond ---------- */
.aer{display:flex;align-items:center;gap:.8rem;margin-top:.6rem;padding:.55rem .75rem;border-radius:.8rem;background:var(--bg2);border:1px solid var(--line)}
.aer .fan{width:2.6rem;height:2.6rem;flex:none}
.aer.run .fan .blades{animation:spin .9s linear infinite;transform-origin:20px 20px}
.aer.run{border-color:#25563d;background:linear-gradient(90deg,rgba(67,192,127,.12),var(--bg2))}
.aer.fault{border-color:#7a2a2a;background:linear-gradient(90deg,rgba(239,83,80,.14),var(--bg2))}
@keyframes spin{to{transform:rotate(360deg)}}
.aer .st{font-size:1.25rem;font-weight:700}
.aer .meta{font-size:.82rem;color:var(--mut);white-space:nowrap}
.aer .st{white-space:nowrap}
.ctl{margin-left:auto;display:flex;gap:.3rem}
.ctl button{background:var(--card);border:1px solid var(--line2);color:var(--tx);border-radius:.5rem;padding:.35rem .6rem;font-size:.8rem;font-weight:700}
.ctl button.sel{background:var(--brand);color:#10200f;border-color:var(--brand)}
.ctl button:disabled{opacity:.4;cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.55rem}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:.7rem;padding:.45rem .6rem}
.stat .k{font-size:.74rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:.1rem}
.stat .v small{font-size:.72rem;color:var(--mut);font-weight:400}
.chart{width:100%;display:block;margin-top:.35rem}
.chart-h{font-size:.8rem;color:var(--mut);margin-top:.55rem;display:flex;justify-content:space-between}

/* ---------- soil ---------- */
.tabs{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}
.tab{background:var(--bg2);border:1px solid var(--line);color:var(--mut);border-radius:.6rem;padding:.35rem .65rem;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:.4rem;position:relative;overflow:hidden}
.tab.on{color:var(--tx);border-color:var(--brand);background:#1a2c1c}
.tab .sd{width:.55rem;height:.55rem;border-radius:50%;background:var(--ok)}
.tab .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--brand);width:0}
.tab.on .bar{animation:fill linear forwards}
@keyframes fill{to{width:100%}}
.soilrow{display:grid;grid-template-columns:1.25fr 1fr;gap:.6rem;margin-top:.55rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.28rem .7rem;font-size:.86rem;align-content:start;background:var(--bg2);border:1px solid var(--line);border-radius:.7rem;padding:.55rem .7rem}
.kv .k{color:var(--mut)} .kv .v{text-align:right;font-weight:600;white-space:nowrap}
.mbar{position:relative;height:.7rem;border-radius:1rem;background:#0a120f;border:1px solid var(--line);margin-top:.35rem;overflow:hidden}
.mbar .band{position:absolute;top:0;bottom:0;background:rgba(67,192,127,.22)}
.mbar .fill{position:absolute;top:0;bottom:0;left:0;border-radius:1rem;transition:width 1s}
table.nodes{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.4rem}
table.nodes th{color:var(--mut);font-weight:600;text-align:left;padding:.25rem .35rem;font-size:.76rem;border-bottom:1px solid var(--line)}
table.nodes td{padding:.32rem .35rem;border-bottom:1px solid #1b2b24;white-space:nowrap;font-variant-numeric:tabular-nums}
table.nodes tr.off td{opacity:.45}
table.nodes tr.sel td{background:rgba(164,224,90,.07)}
.mini{display:inline-block;width:4.5rem;height:.45rem;border-radius:1rem;background:#0a120f;vertical-align:middle;position:relative;overflow:hidden;margin-right:.35rem}
.mini i{position:absolute;left:0;top:0;bottom:0;border-radius:1rem}
.bat{display:inline-flex;align-items:center;gap:.2rem}
.bat b{display:inline-block;width:1.3rem;height:.6rem;border:1px solid var(--mut);border-radius:2px;position:relative}
.bat b i{position:absolute;left:1px;top:1px;bottom:1px;border-radius:1px}
.sig{display:inline-flex;gap:1px;align-items:flex-end;height:.8rem;vertical-align:middle}
.sig i{width:.22rem;background:var(--line2);border-radius:1px}
.sig i.on{background:var(--ok)}

/* ---------- alerts ---------- */
.alist{display:flex;flex-direction:column;gap:.45rem;margin-top:.55rem;overflow-y:auto;min-height:0}
.al{font-size:1rem!important;padding:.65rem .75rem!important}
.advbox{margin-top:.6rem;padding-top:.5rem;border-top:1px solid var(--line)}
.advbox h3{margin:0 0 .2rem;font-size:.95rem;display:flex;align-items:center;gap:.5rem}
.advbox .ic{width:1.15rem;height:1.15rem}
.pill.sms{cursor:pointer}.pill.sms.ok .dot{background:var(--ok)}.pill.sms.warn{color:var(--warn)}.pill.sms.warn .dot{background:var(--warn)}.pill.sms.bad{color:var(--crit)}.pill.sms.bad .dot{background:var(--crit)}
.al{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem .6rem;border-radius:.65rem;background:var(--bg2);border:1px solid var(--line);border-left:.28rem solid var(--info);font-size:.9rem;line-height:1.3}
.al.fresh{animation:slidein .5s}
.al.crit{border-left-color:var(--crit);background:linear-gradient(90deg,rgba(239,83,80,.14),var(--bg2))}
.al.warn{border-left-color:var(--warn)} .al.info{border-left-color:var(--info)}
.al .ti{margin-left:auto;color:var(--dim);font-size:.72rem;white-space:nowrap}
.al.crit .tx{font-weight:600}
@keyframes slidein{from{transform:translateX(1rem);opacity:0}to{transform:none;opacity:1}}
.okmsg{display:flex;align-items:center;gap:.6rem;color:var(--ok);padding:.8rem;font-weight:600}
.adv{display:flex;gap:.55rem;align-items:flex-start;font-size:.9rem;padding:.4rem 0;border-bottom:1px dashed var(--line)}
.adv:last-child{border-bottom:0}
.adv .n{flex:none;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--brand);color:#10200f;font-weight:700;font-size:.78rem;display:grid;place-items:center}

/* ---------- footer ---------- */
footer{display:flex;align-items:center;gap:.8rem;min-width:0}
.ticker{flex:1;overflow:hidden;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:2rem;padding:.42rem 0;position:relative;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.ticker .run{display:inline-block;padding-left:100%;animation:tick 40s linear infinite;font-size:.92rem}
.ticker .run span{margin-right:3rem}
.ticker .run .c{color:var(--crit);font-weight:600}.ticker .run .w{color:var(--warn)}
@keyframes tick{to{transform:translateX(-100%)}}
.scen{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.scen .lb{font-size:.78rem;color:var(--gold);font-weight:700;letter-spacing:.04em;margin-right:.2rem}
.scen button{background:var(--card);border:1px solid #4d4322;color:#e9d9a8;border-radius:1rem;padding:.3rem .65rem;font-size:.78rem}
.scen button.on{background:var(--gold);color:#241a05;border-color:var(--gold);font-weight:700}
.foot-meta{font-size:.75rem;color:var(--dim);white-space:nowrap}
.tokbox{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:9}
.tokbox.show{display:grid}
.tokbox .in{background:var(--card2);border:1px solid var(--line2);border-radius:1rem;padding:1.2rem;min-width:22rem}
.tokbox input{width:100%;margin:.7rem 0;padding:.55rem;border-radius:.5rem;border:1px solid var(--line2);background:var(--bg);color:var(--tx);font-size:1rem}
.tokbox button{background:var(--brand);border:0;border-radius:.5rem;padding:.5rem 1rem;font-weight:700}
.toast{position:fixed;left:50%;top:1rem;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);border-radius:2rem;padding:.5rem 1.1rem;font-weight:600;opacity:0;transition:opacity .3s;z-index:10;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8f07a"/><stop offset="1" stop-color="#3fa266"/></linearGradient></defs>
        <circle cx="24" cy="24" r="22" fill="#132a1c" stroke="#2f5a3c"/>
        <path d="M10 33c6-2 11-2 14 0s9 2 14 0" stroke="#3d9be0" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M24 30C24 20 30 13 38 11c0 9-5 16-14 19z" fill="url(#lg)"/>
        <path d="M24 30c0-7-4-12-11-14 0 7 4 12 11 14z" fill="#7fcf5f"/>
        <path d="M24 30V20" stroke="#0d1a12" stroke-width="1.2"/>
      </svg>
      <div style="min-width:0">
        <div class="bname">BHOO<span>MI</span></div>
        <div class="bsub"><span data-i="app_sub">Smart Farm Monitor</span> · <span id="farm">—</span></div>
      </div>
    </div>
    <div class="clock"><div class="t" id="clk">--:--</div><div class="d" id="dte"></div></div>
    <span class="pill" id="mode"><span class="dot"></span><span id="modeTx">…</span></span>
    <span class="pill sms" id="smsPill" title="4G modem and SMS reports"><span class="dot"></span><span id="smsTx">SMS …</span></span>
    <div class="langs" id="langs"></div>
    <div class="score" title="Farm health">
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#1f3229" stroke-width="4"/>
        <circle id="scArc" cx="20" cy="20" r="16" fill="none" stroke="#43c07f" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="100.5" stroke-dashoffset="100.5" transform="rotate(-90 20 20)" style="transition:stroke-dashoffset 1s,stroke .5s"/>
        <text id="scTx" x="20" y="24.5" text-anchor="middle" fill="#e8f1ec" font-size="12" font-weight="700">--</text></svg>
      <div class="lbl" data-i="health">Farm health</div>
    </div>
  </header>

  <main>
    <!-- ================= POND ================= -->
    <section class="col">
      <div class="card grow" id="pondCard">
        <h2><svg class="ic" viewBox="0 0 24 24"><path d="M3 15c2.5-1.6 5-1.6 7.5 0s5 1.6 7.5 0 2.3-1.2 3-1.4M3 19c2.5-1.6 5-1.6 7.5 0s5 1.6 7.5 0" stroke="#3d9be0" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M12 3c2.6 3.2 4 5.4 4 7.2A4 4 0 0 1 8 10.2C8 8.4 9.4 6.2 12 3z" fill="#56a8e8"/></svg>
          <span data-i="pond">Pond</span><span id="pName" class="mono" style="font-size:.9rem;color:var(--mut)">BHOOMI_PN</span>
          <span class="sub" id="pLink"></span></h2>
        <div class="aer" id="aer">
          <svg class="fan" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#0d1814" stroke="#2f4a3e"/>
            <g class="blades" fill="#56a8e8"><path d="M20 20 L20 5 A7 7 0 0 1 26 13 Z"/><path d="M20 20 L33 27.5 A7 7 0 0 1 23.5 29 Z"/><path d="M20 20 L7 27.5 A7 7 0 0 1 10.5 17 Z"/></g>
            <circle cx="20" cy="20" r="3" fill="#e8f1ec"/></svg>
          <div><div class="st"><span data-i="aerator">Aerator</span>: <span id="aerSt">—</span></div>
            <div class="meta"><span data-i="mode">Mode</span> <b id="aerMode">AUTO</b> · <span id="aerI">— A</span></div></div>
          <div class="ctl" id="ctl" hidden>
            <button data-cmd="ON" data-i="on">ON</button><button data-cmd="OFF" data-i="off">OFF</button><button data-cmd="AUTO" data-i="auto">AUTO</button>
          </div>
        </div>
        <div class="gauges g2" id="pGauges"></div>
        <div class="chart-h"><span data-i="do_chart">Oxygen – last 6 hours</span><span class="mono" id="doRange"></span></div>
        <svg class="chart" id="doChart" style="height:10rem" viewBox="0 0 400 120" preserveAspectRatio="none"></svg>
        <div class="stats">
          <div class="stat"><div class="k" data-i="trend">Trend</div><div class="v" id="sTrend">—</div></div>
          <div class="stat"><div class="k" data-i="dawn">Oxygen at 6 AM</div><div class="v" id="sDawn">—</div></div>
          <div class="stat"><div class="k" data-i="runtime">Aerator run today</div><div class="v" id="sRun">—</div></div>
        </div>
      </div>
    </section>

    <!-- ================= SOIL ================= -->
    <section class="col">
      <div class="card grow">
        <h2><svg class="ic" viewBox="0 0 24 24"><path d="M2 18h20" stroke="#8a6a3c" stroke-width="2.5"/><path d="M2 21h20" stroke="#6d5330" stroke-width="2"/><path d="M12 17V9" stroke="#7fcf5f" stroke-width="2"/><path d="M12 11c0-3 2-5 6-5 0 3-2 5-6 5zM12 13c0-2.4-1.7-4-5-4 0 2.4 1.7 4 5 4z" fill="#a4e05a"/></svg>
          <span data-i="soil">Soil fields</span><span id="sName" class="mono" style="font-size:.9rem;color:var(--mut)">BHOOMI_SN</span>
          <span class="sub" id="sLink"></span></h2>
        <div class="tabs" id="tabs"></div>
        <div class="gauges g4" id="sGauges"></div>
        <div class="soilrow">
          <div>
            <div class="chart-h" style="margin-top:0"><span data-i="moist_chart">Soil moisture – last 6 hours</span><span class="mono" id="mLegend"></span></div>
            <svg class="chart" id="mChart" style="height:8.6rem" viewBox="0 0 400 110" preserveAspectRatio="none"></svg>
          </div>
          <div class="kv" id="sKv"></div>
        </div>
        <div class="chart-h"><span data-i="all_nodes">All soil nodes</span><span></span></div>
        <table class="nodes" id="nTable"></table>
      </div>
    </section>

    <!-- ================= ALERTS (full right side) ================= -->
    <section class="col">
      <div class="card grow" style="display:flex;flex-direction:column">
        <h2><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l10 18H2z" fill="none" stroke="#f0903a" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v5" stroke="#f0903a" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="18" r="1.2" fill="#f0903a"/></svg>
          <span data-i="alerts">Alerts</span><span class="sub" id="aCount"></span></h2>
        <div class="alist grow" id="alist"></div>
        <div class="advbox">
          <h3><svg class="ic" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" fill="none" stroke="#a4e05a" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span data-i="advice">What to do</span></h3>
          <div id="advice"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="scen" id="scen" hidden></div>
    <div class="ticker"><div class="run" id="ticker"></div></div>
    <div class="foot-meta" id="fmeta"></div>
  </footer>
</div>

<div class="tokbox" id="tokbox"><div class="in">

/* ---------------------------------------------------------------- gauges */

function lineChart(svg, o) {

  if (!s.alerts.length) al.innerHTML = `<div class="okmsg"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#43c07f" stroke-width="2"/><path d="M7 12.5l3 3 7-7" stroke="#43c07f" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>${t("all_ok")}</div>`;
  else al.innerHTML = s.alerts.slice(0, 14).map((a) => {
    const k = a.node + a.code, fresh = !shownAlerts.has(k);
    shownAlerts.add(k);
    return `<div class="al ${a.level}${fresh ? " fresh" : ""}"><div class="tx">${esc(alertText(a))}</div><div class="ti">${hhmm(a.ts)}</div></div>`;
  }).join("");
  for (const k of [...shownAlerts]) if (!s.alerts.some((a) => a.node + a.code === k)) shownAlerts.delete(k);
  const nc = s.alerts.filter((a) => a.level === "crit").length, nw = s.alerts.filter((a) => a.level === "warn").length;
  $("aCount").innerHTML = (nc ? `<span class="chip crit">${nc}</span>` : "") + (nw ? `<span class="chip warn">${nw}</span>` : "") +
    (s.alerts.length - nc - nw ? `<span class="chip info">${s.alerts.length - nc - nw}</span>` : "");

  // ---- advice
  const adv = [];
  const seen = new Set();
  nodes.sort((a, b) => (a.type === "POND" ? -1 : 1)).forEach((n) => {
    const a = n.analysis && n.analysis.advice;
    if (a && n.online) { const k = a.code + JSON.stringify(a.p); if (!seen.has(k)) { seen.add(k); adv.push(a); } }
  });
  $("advice").innerHTML = adv.length ? adv.slice(0, 4).map((a, i) => `<div class="adv"><span class="n">${i + 1}</span><span>${esc(adviceText(a))}</span></div>`).join("")
    : `<div class="mut" style="font-size:.9rem;padding:.3rem 0">${s.alerts.length ? "—" : t("all_ok")}</div>`;

  // ---- score
  const sc = s.score, col = sc >= 80 ? HEX.ok : sc >= 55 ? HEX.watch : sc >= 35 ? HEX.warn : HEX.crit;
  $("scArc").style.strokeDashoffset = 100.5 * (1 - sc / 100);
  $("scArc").setAttribute("stroke", col);
  $("scTx").textContent = sc;

  // ---- events -> toast
  for (const e of s.events || []) {
    const k = e.ts + e.code + e.node;
    if (seenEvents.has(k)) continue;
    seenEvents.add(k);
    if (!force && Date.now() - startedAt > 3000 && (e.code.startsWith("CMD_") || e.level === "crit")) toast(alertText(e));
  }

  // ---- ticker + footer
  renderTicker(s, pond, soils);
  const r = s.hub.radios || [];
  $("fmeta").textContent = `${t("hub")} ${s.hub.id} · ${r.map((x) => (x.freq ? x.freq + " MHz" : x.name) + (x.ok ? "" : " ✕")).join(" · ")} · ${s.hub.dups || 0} ${t("dup")}`;
  setMode();
}

function renderPond(n, now) {
  const d = n.data || {}, a = n.analysis || {}, l = n.link || {};
  $("pName").textContent = n.name;
  $("pLink").innerHTML = `${n.online ? "" : `<span class="chip crit">${t("offline_n")}</span>`}${sigBars(l.rssi)} ${l.rssi != null ? l.rssi + " dBm" : ""} · ${ago(n.age_s)}`;
  const faults = (a.faults || []).map((f) => f.code);
  const doOverride = a.do_status === "invalid" ? { c: "dim", s: "st_invalid" } : null;
  pg.DO.set(a.do_status === "invalid" ? null : d.DO, doOverride);
  pg.PH.set(faults.includes(4) || faults.includes(5) ? null : d.PH);
  pg.WT.set(faults.includes(6) ? null : d.WT);
  pg.DOS.set(d.DOS);
  const on = +d.AER === 1, fault = faults.includes(10) || faults.includes(11);
  const box = $("aer");
  box.className = "aer" + (on ? " run" : "") + (fault ? " fault" : "");
  $("aerSt").textContent = on ? t("on") : t("off");
  $("aerSt").style.color = fault ? HEX.crit : on ? HEX.ok : "";
  const mode = (d.MODE || n.mode || "AUTO").toUpperCase();
  $("aerMode").textContent = t(mode.toLowerCase());
  $("aerI").textContent = (num(d.AERI) ? d.AERI.toFixed(2) : "—") + " A";
  document.querySelectorAll("#ctl button").forEach((b) => b.classList.toggle("sel", b.dataset.cmd === mode));
  // chart
  const t1 = now, t0 = now - 6 * 3600;
  const fc = num(a.dawn_forecast) && num(a.hours_to_dawn) && a.hours_to_dawn < 13
    ? [[now, d.DO], [Math.min(now + 3600 * 1.2, now + a.hours_to_dawn * 3600), d.DO + (a.dawn_forecast - d.DO) * Math.min(1, 1.2 / a.hours_to_dawn)]] : null;
  lineChart($("doChart"), { t0, t1: fc ? now + 3600 * 1.2 : t1, ymin: 0, ymax: 12, grid: [0, 4, 8, 12],
    band: [5, 12], lines: [{ y: 4, c: HEX.warn }, { y: 3, c: HEX.crit }],
    series: [{ pts: (n.hist || {}).DO, c: "#56a8e8", fill: true, w: 2.2 }], forecast: fc });
  const dos = (n.hist || {}).DO || [];
  if (dos.length) { const vs = dos.map((p) => p[1]); $("doRange").textContent = `${Math.min(...vs).toFixed(1)}–${Math.max(...vs).toFixed(1)} mg/L`; }
  // stats
  const tr = a.do_trend_ph;
  $("sTrend").innerHTML = num(tr) ? `<span style="color:${tr < -0.3 ? HEX.warn : tr > 0.1 ? HEX.ok : ""}">${tr > 0 ? "▲" : tr < 0 ? "▼" : "■"} ${Math.abs(tr).toFixed(2)}</span> <small>mg/L${t("per_h")}</small>` : "—";
  $("sDawn").innerHTML = num(a.dawn_forecast) ? `<span style="color:${a.dawn_forecast < 4 ? HEX.warn : HEX.ok}">${a.dawn_forecast.toFixed(1)}</span> <small>mg/L</small>` : "—";
  $("sRun").innerHTML = num(a.aer_runtime_min) ? `${a.aer_runtime_min} <small>${t("min")}</small>` : "—";
}

function renderTabs(soils) {
  const box = $("tabs");
  const ids = soils.map((n) => n.id + (n.online ? 1 : 0) + (selSoil === n.id ? "s" : "")).join();
  if (box.dataset.sig === ids + lang) return;
  box.dataset.sig = ids + lang;
  box.innerHTML = "";
  soils.forEach((n) => {
    const b = document.createElement("button");
    b.className = "tab" + (n.id === selSoil ? " on" : "");
    b.innerHTML = `<span class="sd" style="background:${n.online ? HEX.ok : HEX.dim}"></span>${esc(short(n.name))}<span class="bar" style="animation-duration:${SOIL_CYCLE_MS}ms"></span>`;
    b.onclick = () => { selSoil = n.id; pinUntil = Date.now() + 60000; cycleAt = Date.now() + SOIL_CYCLE_MS; render(S, true); };
    box.appendChild(b);
  });
}

let lastCrop = "";
function renderSoil(n, now) {
  const d = n.data || {}, a = n.analysis || {}, l = n.link || {};
  $("sName").textContent = n.name;
  $("sLink").innerHTML = `${n.online ? "" : `<span class="chip crit">${t("offline_n")}</span>`}${sigBars(l.rssi)} ${l.hop ? `${t("via")} ${esc(short(nodeName(l.via)))}` : t("direct")} · ${ago(n.age_s)}`;
  const lo = a.moist_min ?? 25, hi = a.moist_max ?? 65;
  if (lastCrop !== lo + "/" + hi) { lastCrop = lo + "/" + hi; sg.M1.setBands(moistBands(lo, hi)); sg.M2.setBands(moistBands(lo, hi)); }
  ["M1", "M2", "ST", "AT", "RH", "LUX", "LWH"].forEach((k) => sg[k].set(d[k]));
  if (num(d.PH)) { setX8("SPH"); sg.X8.set(d.PH); } else { setX8("VPD"); sg.X8.set(a.vpd); }
  // moisture chart
  const h = n.hist || {};
  lineChart($("mChart"), { t0: now - 6 * 3600, t1: now, ymin: 0, ymax: 100, grid: [0, 50, 100], band: [lo, hi],
    series: [{ pts: h.M1, c: "#a4e05a", w: 2.2, fill: true }, { pts: h.M2, c: "#e8b04a", w: 1.8, dash: true }] });
  $("mLegend").innerHTML = `<span style="color:#a4e05a">━ 15</span> <span style="color:#e8b04a">┅ 30 cm</span>`;
  // key/values
  const rm = a.root_moisture, mcol = a.moist_status === "dry" ? HEX.crit : a.moist_status === "wet" ? HEX.cold : HEX.ok;
  const fr = a.fungal_risk || "low", frc = fr === "high" ? "crit" : fr === "medium" ? "watch" : "ok";
  $("sKv").innerHTML = `
    <span class="k">${t("crop")}</span><span class="v">${esc(cropName(n.crop))} · ${esc(n.zone || "")}</span>
    <span class="k" style="grid-column:1/3">${t("root")} <b style="float:right;color:${mcol}">${fmt(rm)}%</b>
      <div class="mbar"><div class="band" style="left:${lo}%;width:${hi - lo}%"></div><div class="fill" style="width:${Math.min(100, rm || 0)}%;background:${mcol}"></div></div></span>
    <span class="k">${t("fungal")}</span><span class="v"><span class="chip ${frc}">${t("risk_" + fr)}</span></span>
    <span class="k">${t("VPD")}</span><span class="v">${fmt(a.vpd, 2)} kPa</span>
    <span class="k">${t("battery")}</span><span class="v">${batHtml(a.battery_pct)} <span class="mut">${fmt(d.BV, 2)} V</span></span>
    <span class="k">${t("signal")}</span><span class="v">${l.rssi != null ? l.rssi + " dBm / " + fmt(l.snr) + " dB" : (l.hop ? `${t("hops")}: ${l.hop}` : "—")}</span>
    <span class="k">${t("last_seen")}</span><span class="v">${ago(n.age_s)}</span>`;
}

function renderTable(soils, now) {
  let h = `<tr><th></th><th>${t("crop")}</th><th>${t("root")}</th><th>${t("AT")}</th><th>${t("RH")}</th><th>${t("battery")}</th><th>${t("signal")}</th><th>${t("last_seen")}</th></tr>`;
  for (const n of soils) {
    const a = n.analysis || {}, d = n.data || {}, l = n.link || {};
    const rm = a.root_moisture, c = a.moist_status === "dry" ? HEX.crit : a.moist_status === "wet" ? HEX.cold : HEX.ok;
    h += `<tr class="${n.online ? "" : "off"} ${n.id === selSoil ? "sel" : ""}">
      <td><b>${esc(short(n.name))}</b></td><td>${esc(cropName(n.crop))}</td>
      <td><span class="mini"><i style="width:${Math.min(100, rm || 0)}%;background:${c}"></i></span>${fmt(rm, 0)}%</td>
      <td>${fmt(d.AT)}°</td><td>${fmt(d.RH, 0)}%</td><td>${batHtml(a.battery_pct)}</td>
      <td>${sigBars(l.rssi)} ${l.hop ? "↪" + esc(short(nodeName(l.via))) : ""}</td><td class="mut">${ago(n.age_s)}</td></tr>`;
  }
  $("nTable").innerHTML = h;
}

let tickerSig = "";
function renderTicker(s, pond, soils) {
  let items = s.alerts.map((a) => `<span class="${a.level === "crit" ? "c" : a.level === "warn" ? "w" : ""}">● ${esc(alertText(a))}</span>`);
  if (!items.length) {
    items = [`<span style="color:var(--ok)">✔ ${esc(t("all_ok"))}</span>`];
    if (pond && pond.online) items.push(`<span>${esc(short(pond.name))} · ${t("DO")} ${fmt(pond.data.DO, 2)} mg/L · pH ${fmt(pond.data.PH, 2)} · ${fmt(pond.data.WT)} °C</span>`);
    soils.filter((n) => n.online).forEach((n) => items.push(`<span>${esc(short(n.name))} · ${t("root")} ${fmt(n.analysis.root_moisture, 0)}% · ${fmt(n.data.AT)} °C · ${fmt(n.data.RH, 0)}%</span>`));
  }
  const sig = items.join("");
  if (sig === tickerSig) return;
  tickerSig = sig;
  const el = $("ticker");
  el.innerHTML = sig;
  el.style.animationDuration = Math.max(25, sig.replace(/<[^>]+>/g, "").length * 0.18) + "s";
}

/* -------------------------------------------------------- mode / clock */
function setMode() {
  const pill = $("mode"), tx = $("modeTx");
  if (!BOOT.live) { pill.className = "pill demo"; tx.textContent = `${t("demo")} · ${t("sim_note")}`; return; }
  const stale = Date.now() - lastMsg > 45000;
  if (!connected || stale) { pill.className = "pill off"; tx.textContent = lastMsg ? t("offline") : t("connecting"); }
  else if (S && S.hub.mode === "sim") { pill.className = "pill demo"; tx.textContent = `${t("demo")} · ${t("sim_note")}`; }
  else { pill.className = "pill live"; tx.textContent = t("live"); }
}
function tickClock() {
  const ts = BOOT.live || !S ? Date.now() : S.now * 1000;
  const loc = I18N[lang]._locale;
  try {
    $("clk").textContent = new Intl.DateTimeFormat("en-IN", { hour: "2-digit", minute: "2-digit", second: BOOT.live ? "2-digit" : undefined, hour12: false, timeZone: "Asia/Kolkata" }).format(ts);
    $("dte").textContent = new Intl.DateTimeFormat(loc, { weekday: "long", day: "numeric", month: "long", timeZone: "Asia/Kolkata" }).format(ts);
  } catch (e) { $("clk").textContent = new Date(ts).toLocaleTimeString(); }
  setMode();
  // auto-cycle soil node tabs
  if (S && Date.now() > cycleAt && Date.now() > pinUntil) {
    const soils = Object.values(S.nodes).filter((n) => n.type === "SOIL");
    if (soils.length > 1) {
      const i = soils.findIndex((n) => n.id === selSoil);
      selSoil = soils[(i + 1) % soils.length].id;
      cycleAt = Date.now() + SOIL_CYCLE_MS;
      $("tabs").dataset.sig = "";
      render(S, true);
    } else cycleAt = Date.now() + SOIL_CYCLE_MS;
  }
}
setInterval(tickClock, 1000);

/* -------------------------------------------------------------- control */
const ctl = $("ctl");
function pondId() { const p = S && Object.values(S.nodes).find((n) => n.type === "POND"); return p && p.id; }
async function sendCmd(cmd) {
  const node = pondId(); if (!node) return;
  if (!BOOT.live) { window.BhoomiDemo.command(node, { AER: cmd }); toast(`${t("sent")}: AER=${cmd}`); return; }
  let tok = store.sget("token");
  if (!tok) { tok = await askToken(); if (!tok) return; }
  try {
    const r = await fetch((BOOT.api || "") + "/api/cmd", { method: "POST", headers: { "Content-Type": "application/json", "X-Token": tok },
      body: JSON.stringify({ node, cmd: { AER: cmd } }) });
    const j = await r.json();
    if (!r.ok) { if (r.status === 403) store.sset("token", ""); throw new Error(j.error || r.status); }
    store.sset("token", tok);
    toast(`${t("sent")}: AER=${cmd}`);
  } catch (e) { toast(`${t("cmd_err")}: ${e.message}`); }
}
function askToken() {
  return new Promise((res) => {
    const box = $("tokbox"), inp = $("tokIn");
    box.classList.add("show"); inp.value = ""; inp.focus();
    const done = (v) => { box.classList.remove("show"); $("tokOk").onclick = null; inp.onkeydown = null; res(v); };
    $("tokOk").onclick = () => done(inp.value.trim());
    inp.onkeydown = (e) => { if (e.key === "Enter") done(inp.value.trim()); if (e.key === "Escape") done(""); };
    box.onclick = (e) => { if (e.target === box) done(""); };
  });
}
if (!BOOT.live || BOOT.control) {
  ctl.hidden = false;
  ctl.querySelectorAll("button").forEach((b) => (b.onclick = () => sendCmd(b.dataset.cmd)));
}

/* ------------------------------------------------------------- SMS / 4G */
let SMS = null;
function smsBase() { return BOOT.sms || (location.protocol === "file:" ? "" : `${location.protocol}//${location.hostname}:8091`); }
function renderSms() {
  const pill = $("smsPill"), tx = $("smsTx");
  if (!SMS) { pill.className = "pill sms bad"; tx.textContent = "SMS ✕"; return; }
  const ok = SMS.modem === "registered", bars = SMS.signal_dbm == null ? 0 : SMS.signal_dbm > -75 ? 4 : SMS.signal_dbm > -85 ? 3 : SMS.signal_dbm > -95 ? 2 : 1;
  pill.className = "pill sms " + (ok ? "ok" : "warn");
  tx.textContent = `4G ${"▮".repeat(bars)}${"▯".repeat(4 - bars)} · SMS ${SMS.daily_report_time || ""}${SMS.last_daily_date ? " ✓" : ""}`;
}
async function pollSms() {
  if (!BOOT.live) { SMS = { modem: "registered", signal_dbm: -71, daily_report_time: "07:00", last_daily: "07:00", last_daily_date: "today", last_request: "+91980***12 STATUS", registered: 3, sent_today: 4 }; renderSms(); return; }
  try { const r = await fetch(smsBase() + "/sms/status", { cache: "no-store" }); SMS = await r.json(); } catch (e) { SMS = null; }
  renderSms();
}
$("smsPill").onclick = () => {
  if (!SMS) { toast("SMS service not running"); return; }
  toast(`SMS: daily report ${SMS.daily_report_time || "–"} (last ${SMS.last_daily || "–"}) · last request ${SMS.last_request || "–"} · ${SMS.registered || 0} numbers · ${SMS.sent_today || 0} sent today`);
};
pollSms(); setInterval(pollSms, 15000);

/* ------------------------------------------------------------ data feed */
const startedAt = Date.now();
function onState(s) { lastMsg = Date.now(); connected = true; render(s); }
function startLive() {
  const base = BOOT.api || "";
  fetch(base + "/api/state").then((r) => r.json()).then(onState).catch(() => {});
  let es;
  const open = () => {
    es = new EventSource(base + "/api/events");
    es.addEventListener("state", (e) => { try { onState(JSON.parse(e.data)); } catch (err) { console.error(err); } });
    es.onerror = () => { connected = false; setMode(); };
  };
  open();
  setInterval(() => {   // watchdog: reconnect a silent stream
    if (Date.now() - lastMsg > 60000) { try { es.close(); } catch (e) {} open(); fetch(base + "/api/state").then((r) => r.json()).then(onState).catch(() => {}); }
  }, 30000);
}
function startDemo() {
  const box = $("scen");
  box.hidden = false;
  const draw = () => {
    box.innerHTML = `<span class="lb">${t("sc_title")}:</span>`;
    window.BhoomiDemo.scenarios.forEach((sc) => {
      const b = document.createElement("button");
      b.textContent = t("sc_" + sc);
      if (window.BhoomiDemo.current === sc) b.className = "on";
      b.onclick = () => { window.BhoomiDemo.scenario(sc); draw(); };
      box.appendChild(b);
    });
  };
  window.addEventListener("bhoomi-lang", draw);
  window.BhoomiDemo.start(onState);
  // open a scenario straight from the link, e.g. ...#night  #dry  #fungal  #relay  #aer  #heat
  const h = (location.hash || "").slice(1);
  if (window.BhoomiDemo.scenarios.includes(h)) window.BhoomiDemo.scenario(h);
  if (LANGS.includes(h)) { lang = h; applyLang(); }
  draw();
}
const _apply = applyLang;
applyLang = function () { _apply(); window.dispatchEvent(new Event("bhoomi-lang")); };

applyLang();
tickClock();
if (BOOT.live) startLive(); else startDemo();
window.addEventListener("resize", () => S && render(S, true));
})();

</script>
</body>
</html>
