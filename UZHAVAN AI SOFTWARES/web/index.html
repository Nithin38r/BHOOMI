<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15110d" />
    <meta name="description" content="BHOOMI: one low-cost LoRa radio network for the whole farm. Solar soil nodes, a pond oxygen node, a hub that keeps working offline, and a farmer app in Telugu and Tamil." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>BHOOMI</title>
    <script>
      // Hide reveal targets from the first frame so nothing flashes; if the motion script never starts, show everything.
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches && !/[?&]still\b/.test(location.search)) {
        document.documentElement.classList.add("motion");
        setTimeout(function () { if (!window.__bhoomiMotion) document.documentElement.classList.remove("motion"); }, 4000);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
